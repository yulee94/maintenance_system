name: Mobile CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "mobile-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "Mobile build profile"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      submit:
        description: "Submit build to TestFlight / Play track"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DATABASE_URL: "postgresql://maintenance:maintenance@localhost:5432/maintenance_ci"
  DEMO_MODE: "true"
  JWT_SECRET: "ci-maintenance-secret"
  NEXT_TELEMETRY_DISABLED: "1"
  DEV_API_URL: ${{ vars.DEV_API_URL || 'https://api-dev-maintenance.example.co.kr' }}
  STAGING_API_URL: ${{ vars.STAGING_API_URL || 'https://api-staging-maintenance.example.co.kr' }}
  PROD_API_URL: ${{ vars.PROD_API_URL || 'https://api-maintenance.example.co.kr' }}
  CRASH_REPORTING_PROVIDER: ${{ vars.CRASH_REPORTING_PROVIDER || 'sentry' }}
  FIREBASE_CRASHLYTICS_ENABLED: ${{ vars.FIREBASE_CRASHLYTICS_ENABLED || 'false' }}
  ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER || 'firebase' }}
  REMOTE_CONFIG_PROVIDER: ${{ vars.REMOTE_CONFIG_PROVIDER || 'api' }}
  APP_PRIVACY_POLICY_URL: ${{ vars.APP_PRIVACY_POLICY_URL || 'https://maintenance.example.co.kr/privacy' }}
  APP_TERMS_URL: ${{ vars.APP_TERMS_URL || 'https://maintenance.example.co.kr/terms' }}
  APP_SUPPORT_URL: ${{ vars.APP_SUPPORT_URL || 'https://maintenance.example.co.kr/support' }}
  APP_REVIEW_NOTES_URL: ${{ vars.APP_REVIEW_NOTES_URL || 'https://maintenance.example.co.kr/app-review' }}
  APP_SUPPORT_EMAIL: ${{ vars.APP_SUPPORT_EMAIL || 'support@maintenance.example.co.kr' }}
  APP_SUPPORT_PHONE: ${{ vars.APP_SUPPORT_PHONE || '02-0000-0000' }}
  APP_SUPPORT_HOURS: ${{ vars.APP_SUPPORT_HOURS || '평일 09:00-18:00' }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}

jobs:
  validate:
    name: Validate web API and mobile app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web/admin API
        run: npm run typecheck

      - name: Build web/admin API
        run: npm run build

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Check Expo project health
        working-directory: mobile
        run: npx expo-doctor

      - name: Check Expo dependency versions
        working-directory: mobile
        run: npx expo install --check

  staging-build:
    name: Build staging mobile app
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'staging') }}
    env:
      APP_ENV: staging
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      AUTO_SUBMIT: ${{ github.event_name == 'push' || inputs.submit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm install --global eas-cli

      - name: Skip EAS build when token is missing
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "EXPO_TOKEN is not configured. Validation passed; EAS staging build was skipped."

      - name: Build staging app
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: mobile
        run: |
          if [ "${AUTO_SUBMIT}" = "true" ]; then
            eas build --platform all --profile staging --non-interactive --no-wait --auto-submit
          else
            eas build --platform all --profile staging --non-interactive --no-wait
          fi

  production-build:
    name: Build production mobile app
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'production') }}
    env:
      APP_ENV: prod
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      AUTO_SUBMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.submit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm install --global eas-cli

      - name: Skip EAS build when token is missing
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "EXPO_TOKEN is not configured. Validation passed; EAS production build was skipped."

      - name: Build production app
        if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: mobile
        run: |
          if [ "${AUTO_SUBMIT}" = "true" ]; then
            eas build --platform all --profile production --non-interactive --no-wait --auto-submit
          else
            eas build --platform all --profile production --non-interactive --no-wait
          fi
