services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintenance_system
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://maintenance:maintenance@postgres:5432/maintenance_system?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      APP_BASE_URL: http://localhost:3000
      UPLOAD_ROOT: /app/storage/uploads
      BACKUP_ROOT: /app/storage/backups
      EXCEL_TEMPLATE_ROOT: /app/docs/templates
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
      - ./docs/templates:/app/docs/templates:ro

volumes:
  postgres-data:
